name: Release

# Push a tag such as v1.0 to build a signed APK and an unsigned IPA and attach them to a draft
# GitHub release. Run it by hand (Actions → Release → Run workflow) to get the files as artifacts only.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-checks:
    uses: ./.github/workflows/ios-checks.yml

  android:
    runs-on: ubuntu-latest
    env:
      # SHA-256 of the DriftLoom release certificate. A build signed with any other key fails.
      RELEASE_CERT_SHA256: 3959fc6b7a604ce8ea5ccf1f88ecc554507a1f3e706e0df9f625d70d378617ad
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Restore the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.DRIFTLOOM_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::DRIFTLOOM_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/driftloom-release.jks"
          echo "DRIFTLOOM_KEYSTORE_FILE=$RUNNER_TEMP/driftloom-release.jks" >> "$GITHUB_ENV"

      - name: Build the signed release APK
        env:
          DRIFTLOOM_KEYSTORE_PASSWORD: ${{ secrets.DRIFTLOOM_KEYSTORE_PASSWORD }}
          DRIFTLOOM_KEY_ALIAS: ${{ secrets.DRIFTLOOM_KEY_ALIAS }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Check the signature and name the APK
        run: |
          rm -f "$RUNNER_TEMP/driftloom-release.jks"
          META=app/build/outputs/apk/release/output-metadata.json
          VERSION_NAME="$(jq -r '.elements[0].versionName' "$META")"
          APK="$(jq -r '.elements[0].outputFile' "$META")"
          APKSIGNER="$(printf '%s\n' "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs "app/build/outputs/apk/release/$APK" | tee "$RUNNER_TEMP/certs.txt"
          grep -qi "certificate SHA-256 digest: $RELEASE_CERT_SHA256" "$RUNNER_TEMP/certs.txt" \
            || { echo "::error::APK is not signed with the DriftLoom release key"; exit 1; }
          mkdir -p dist
          mv "app/build/outputs/apk/release/$APK" "dist/DriftLoom-$VERSION_NAME.apk"
          (cd dist && sha256sum "DriftLoom-$VERSION_NAME.apk" > "DriftLoom-$VERSION_NAME.apk.sha256")
          echo "Android $VERSION_NAME, signed with the release key" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/*

  ios:
    needs: ios-checks
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        run: |
          XCODE="$(printf '%s\n' /Applications/Xcode_26*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build the unsigned IPA
        run: scripts/build-ios-ipa.sh dist

      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: |
            dist/*.ipa
            dist/*.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: android
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: ios
          path: dist

      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          # Notes come from docs/release-notes/<version>.md at the tagged commit.
          gh api "repos/$GITHUB_REPOSITORY/contents/docs/release-notes/${TAG#v}.md?ref=$TAG" \
            -H "Accept: application/vnd.github.raw" > notes.md \
            || echo "Install guide: https://github.com/$GITHUB_REPOSITORY/blob/main/docs/install-ios.md. Check downloads against the .sha256 files." > notes.md
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "DriftLoom ${TAG#v}" --notes-file notes.md
