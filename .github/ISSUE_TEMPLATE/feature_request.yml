name: Feature request
description: Suggest something DriftLoom should do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Thanks for the idea. :hugs:

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: "I searched the [open and closed issues](https://github.com/sk3llo/DriftLoom/issues?q=is%3Aissue) and this hasn't been requested."
          required: true
        - label: "I checked the [user guide](https://github.com/sk3llo/DriftLoom/blob/main/docs/user-guide/README.md) and the app doesn't already do this."
          required: true
        - label: "This issue is about one feature."
          required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - iOS / iPadOS
        - Android

  - type: textarea
    id: feature-description
    attributes:
      label: Feature description
      description: How should the app look or behave?
    validations:
      required: true

  - type: textarea
    id: why-is-the-feature-requested
    attributes:
      label: Why do you want this feature?
      description: What problem or limitation would it solve?
    validations:
      required: true

  - type: textarea
    id: additional-information
    attributes:
      label: Additional information
      description: Sketches, mockups, or how NewPipe or another app does it.
