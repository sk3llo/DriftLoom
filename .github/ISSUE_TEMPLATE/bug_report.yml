name: Bug report
description: Something in DriftLoom doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. :hugs:

        Tip: **Settings → Help → Report a problem** in the app fills in the version and device details for you.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: "I searched the [open and closed issues](https://github.com/sk3llo/DriftLoom/issues?q=is%3Aissue) and this isn't already reported."
          required: true
        - label: "I checked [Troubleshooting](https://github.com/sk3llo/DriftLoom/blob/main/docs/user-guide/troubleshooting.md) in the user guide."
          required: true
        - label: "This issue is about one bug."
          required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iOS / iPadOS
        - Android
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: DriftLoom version
      description: Shown in the app under About.
      placeholder: "1.0 (1)"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and OS version
      placeholder: "iPhone 12, iOS 17.5 / Pixel 7, Android 14"
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: What did you do for the bug to show up? If it doesn't happen every time, say what you remember.
      placeholder: |
        1. Open '...'
        2. Tap '...'
        3. Swipe down to '...'
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error message or logs
      description: The error text the app showed, or the report from "Copy details" / "Copy formatted report".
      render: text

  - type: textarea
    id: screen-media
    attributes:
      label: Screenshots or screen recording
      description: You can drop files straight into this box.

  - type: textarea
    id: additional-information
    attributes:
      label: Additional information
      description: Anything else, such as the video or channel link, your content country and language, or a VPN.
